<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="1200" height="510" rx="32" fill="#eff7f0"/><circle cx="988" cy="260" r="195" fill="#d9efdf"/><text x="64" y="133" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#27856f">YOUR DAY. A LITTLE ADVENTURE.</text><text x="60" y="224" font-family="Arial,sans-serif" font-size="78" font-weight="700" fill="#254a44">GoWIN!Buddy</text><text x="64" y="286" font-family="Arial,sans-serif" font-size="25" fill="#567169">A desktop companion for tasks, focus and tiny wins.</text><text x="64" y="350" font-family="Arial,sans-serif" font-size="19" fill="#27856f">DESKTOP PET   /   LOCAL RPG   /   WINDOWS</text><g transform="translate(861 162) scale(12)"><defs>
