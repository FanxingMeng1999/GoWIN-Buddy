name: Build and release Windows installer
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.14.0'
      - name: Build standalone installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/build-installer.ps1
      - name: Stage versioned installer and checksum
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content apps/pet-desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match app version $version"
          }
          $assetName = "GoWINBuddy-Setup-$version.exe"
          $assetPath = "installer/windows/dist/$assetName"
          Copy-Item installer/windows/dist/GoWINBuddy-Setup.exe $assetPath -Force
          $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content installer/windows/dist/SHA256SUMS.txt -Encoding ascii
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: GoWINBuddy-Windows-installer-${{ steps.package.outputs.version }}
          path: |
            installer/windows/dist/GoWINBuddy-Setup-${{ steps.package.outputs.version }}.exe
            installer/windows/dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $installer = "installer/windows/dist/GoWINBuddy-Setup-$env:RELEASE_VERSION.exe"
          $checksum = 'installer/windows/dist/SHA256SUMS.txt'
          $notes = "docs/release-$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Release notes are missing: $notes" }
          gh release create $env:RELEASE_TAG $installer $checksum `
            --repo $env:GITHUB_REPOSITORY `
            --title "GoWIN!Buddy $env:RELEASE_VERSION / Compact Desktop Companions / 紧凑桌面伙伴" `
            --notes-file $notes --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($release.tagName -ne $env:RELEASE_TAG -or $release.isDraft) { throw 'The published release is missing or still a draft' }
          $assetNames = @($release.assets | ForEach-Object name)
          foreach ($expected in @((Split-Path $installer -Leaf), (Split-Path $checksum -Leaf))) {
            if ($assetNames -notcontains $expected) { throw "Release asset is missing: $expected" }
          }
