<g id="blue-hour-idle-accent"><path d="M7.5 10.9l.6 1.2 1.3.2-.95.95.2 1.3-1.15-.65-1.15.65.2-1.3-.95-.95 1.3-.2z" fill="#ffdca0"/></g>
