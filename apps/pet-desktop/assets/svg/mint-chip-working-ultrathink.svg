<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" preserveAspectRatio="xMidYMid meet" role="img" data-species="turtle" data-art-version="3" aria-label="Mossy Turtle">
<title>Mossy Turtle — original artwork by FanxingMeng1999 (MIT)</title>
<defs>
<radialGradient id="paint-body" cx=".29" cy=".20" r=".84"><stop stop-color="#d7f4ec"/><stop offset=".42" stop-color="#b3eadb"/><stop offset="1" stop-color="#7ac5b5"/></radialGradient>
<linearGradient id="paint-trim" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#7cbbb0"/><stop offset="1" stop-color="#258e7b"/></linearGradient>
<radialGradient id="paint-cream" cx=".30" cy=".18" r=".85"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#fff4e8"/><stop offset="1" stop-color="#e9d8c2"/></radialGradient>
