<path d="M6.9 12.1q.6 0.35 1.2 0" fill="none" stroke="#283738" stroke-width=".22" stroke-linecap="round"/>

<g class="dream" fill="#829270" opacity=".65"><path d="M12.8 4h1.3l-1.3 1.35h1.3" fill="none" stroke="#829270" stroke-width=".20" stroke-linecap="round" stroke-linejoin="round"/></g>
</g></g></g></svg>