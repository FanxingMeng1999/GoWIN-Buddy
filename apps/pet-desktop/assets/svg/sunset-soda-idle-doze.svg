<radialGradient id="paint-cream" cx=".30" cy=".18" r=".85"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#fff4e8"/><stop offset="1" stop-color="#e9d8c2"/></radialGradient>
<linearGradient id="paint-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ceebe4"/><stop offset=".45" stop-color="#a6dbcd"/><stop offset="1" stop-color="#aebba4"/></linearGradient>
