<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" preserveAspectRatio="xMidYMid meet" role="img" data-species="fox" data-art-version="3" aria-label="Soda Fox">
<title>Soda Fox — original artwork by FanxingMeng1999 (MIT)</title>
<defs>
<radialGradient id="paint-body" cx=".29" cy=".20" r=".84"><stop stop-color="#fcdfc8"/><stop offset=".42" stop-color="#f9c296"/><stop offset="1" stop-color="#e3a282"/></radialGradient>
