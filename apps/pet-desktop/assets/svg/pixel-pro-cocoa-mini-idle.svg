<rect x="3.45" y="10.65" width="8.1" height="4.8" rx="1.75" fill="url(#paint-body)"/><rect x="2.6" y="4.5" width="9.8" height="7.95" rx="2.3" fill="url(#paint-body)"/><rect x="3.75" y="6.05" width="7.5" height="4.55" rx="1.45" fill="url(#paint-screen)"/><path d="M3.6 6.0q.1-.65.9-.7h3.0" fill="none" stroke="#ffffff" stroke-width=".25" stroke-linecap="round" opacity=".6"/><path d="M4.35 6.55h2.5" stroke="#b3d8d1" stroke-width=".16" stroke-linecap="round" opacity=".35"/>
<rect x="6.2" y="13.1" width="2.6" height=".85" rx=".35" fill="url(#paint-trim)" opacity=".7"/><circle cx="7.5" cy="13.5" r=".22" fill="url(#paint-gold)"/>
<g id="pixel-pro-mini-accent"></g>
<g id="eyes-js" fill="#ffd98c"><g class="blink-open"><ellipse cx="5.6" cy="8.25" rx="0.43" ry="0.65"/><ellipse cx="9.4" cy="8.25" rx="0.43" ry="0.65"/><circle cx="5.51" cy="8.00" r=".13" fill="white"/><circle cx="9.31" cy="8.00" r=".13" fill="white"/></g><g class="blink-lids"><path d="M5.17 8.25q0.43 .40 0.86 0M8.97 8.25q0.43 .40 0.86 0" fill="none" stroke="#ffd98c" stroke-width=".25" stroke-linecap="round"/></g></g><g id="eyes-doze" style="display:none"><path d="M5.17 8.25q0.43 .40 0.86 0M8.97 8.25q0.43 .40 0.86 0" fill="none" stroke="#ffd98c" stroke-width=".25" stroke-linecap="round"/></g>

<path d="M6.9 9.65q.6 0.35 1.2 0" fill="none" stroke="#ffd98c" stroke-width=".22" stroke-linecap="round"/>


</g></g></g></svg>