<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" preserveAspectRatio="xMidYMid meet" role="img" data-species="robot" data-art-version="3" aria-label="Pocket Robot">
<title>Pocket Robot — original artwork by FanxingMeng1999 (MIT)</title>
<defs>
<radialGradient id="paint-body" cx=".29" cy=".20" r=".84"><stop stop-color="#d9f1e9"/><stop offset=".42" stop-color="#b5e4d4"/><stop offset="1" stop-color="#83bbad"/></radialGradient>
<linearGradient id="paint-trim" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#88b2ab"/><stop offset="1" stop-color="#397e73"/></linearGradient>
<radialGradient id="paint-cream" cx=".30" cy=".18" r=".85"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#fff4e8"/><stop offset="1" stop-color="#e9d8c2"/></radialGradient>
<linearGradient id="paint-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbe3b7"/><stop offset=".45" stop-color="#f7cc7c"/><stop offset="1" stop-color="#e1b272"/></linearGradient>
<linearGradient id="paint-screen" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#42615e"/><stop offset="1" stop-color="#263d3b"/></linearGradient>
</defs>
<style>#body-js{transform-origin:7.5px 16px}.idle-motion{animation:breathe 3.55s ease-in-out infinite}.working-motion{animation:focus 2.3s ease-in-out infinite}.happy-motion{animation:hop 1.35s cubic-bezier(.4,0,.2,1) infinite}.rest-motion{animation:rest 4.8s ease-in-out infinite}.reaction-motion{animation:greet 1.5s cubic-bezier(.4,0,.2,1) infinite}.crest{animation:crest 3.8s ease-in-out infinite}.tail{animation:tail 3.2s ease-in-out infinite}.claw-left{animation:claw-left 3.4s ease-in-out infinite}.claw-right{animation:claw-right 3.4s ease-in-out infinite}.happy-motion .claw-left{animation:wave-left 1.35s ease-in-out infinite}.happy-motion .claw-right{animation:wave-right 1.35s ease-in-out infinite}.happy-motion .limb-right{animation:wave-right 1.35s ease-in-out infinite}.working-motion .limb-left{animation:tap .62s ease-in-out infinite}.working-motion .limb-right{animation:tap .62s .31s ease-in-out infinite}.sparkles,.dream{animation:glow 1.8s ease-in-out infinite}.blink-open{animation:blink-open 4.6s linear infinite}.blink-lids{animation:blink-lids 4.6s linear infinite;opacity:0}.rest-motion .crest,.rest-motion .tail,.rest-motion .claw-left,.rest-motion .claw-right{animation-duration:5.8s}@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}42%{transform:translateY(-.46px) rotate(-.45deg)}58%{transform:translateY(-.54px) rotate(-.2deg)}}@keyframes focus{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(.1px) rotate(.2deg)}62%{transform:translateY(-.34px) rotate(.45deg)}82%{transform:translateY(-.08px) rotate(-.15deg)}}@keyframes rest{0%,100%{transform:translateY(0) rotate(0)}48%{transform:translateY(-.26px) rotate(-.18deg)}58%{transform:translateY(-.31px) rotate(-.1deg)}}@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}32%{transform:translateY(-1.35px) rotate(-1.8deg)}43%{transform:translateY(-1.52px) rotate(-.8deg)}62%{transform:translateY(.1px) rotate(1.25deg)}76%{transform:translateY(-.14px) rotate(-.35deg)}}@keyframes greet{0%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-.48px) rotate(-1deg)}34%{transform:translateY(-.82px) rotate(2.4deg)}55%{transform:translateY(-.24px) rotate(-.75deg)}74%{transform:translateY(.05px) rotate(.25deg)}}@keyframes crest{50%{transform:rotate(3.5deg)}}@keyframes tail{50%{transform:rotate(-6deg)}}@keyframes claw-left{50%{transform:rotate(-5deg)}}@keyframes claw-right{50%{transform:rotate(5deg)}}@keyframes wave-left{50%{transform:rotate(-24deg)}}@keyframes wave-right{50%{transform:rotate(24deg)}}@keyframes tap{50%{transform:translateY(.58px)}}@keyframes glow{50%{opacity:.42}}@keyframes blink-open{0%,93%,97%,100%{opacity:1}94%,96%{opacity:0}}@keyframes blink-lids{0%,93%,97%,100%{opacity:0}94%,96%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.blink-lids{display:none}}</style>
<ellipse id="shadow-js" cx="7.5" cy="16.5" rx="5.5" ry=".55" fill="#294b43" opacity=".09"/><ellipse cx="7.5" cy="16.5" rx="3.6" ry=".32" fill="#294b43" opacity=".07"/>
<g data-size-profile="compact-uniform" transform="translate(1.65 3.52) scale(.78)"><g id="body-js"><g class="idle-motion" style="transform-origin:7.5px 16px">
