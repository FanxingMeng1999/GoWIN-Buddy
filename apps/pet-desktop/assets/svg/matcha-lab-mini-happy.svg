<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" preserveAspectRatio="xMidYMid meet" role="img" data-species="frog" data-art-version="3" aria-label="Matcha Frog">
<title>Matcha Frog — original artwork by FanxingMeng1999 (MIT)</title>
<defs>
<radialGradient id="paint-body" cx=".29" cy=".20" r=".84"><stop stop-color="#e0edcc"/><stop offset=".42" stop-color="#c3dc9c"/><stop offset="1" stop-color="#99b57c"/></radialGradient>
<linearGradient id="paint-trim" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#9bb094"/><stop offset="1" stop-color="#597b4c"/></linearGradient>
<radialGradient id="paint-cream" cx=".30" cy=".18" r=".85"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#fff4e8"/><stop offset="1" stop-color="#e9d8c2"/></radialGradient>
<linearGradient id="paint-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e0bc"/><stop offset=".45" stop-color="#f0c685"/><stop offset="1" stop-color="#dcae78"/></linearGradient>
<linearGradient id="paint-screen" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#42615e"/><stop offset="1" stop-color="#263d3b"/></linearGradient>
</defs>
<style>#body-js{transform-origin:7.5px 16px}.idle-motion{animation:breathe 3.6s ease-in-out infinite}.working-motion{animation:focus 2.2s ease-in-out infinite}.happy-motion{animation:hop 1.3s ease-in-out infinite}.rest-motion{animation:rest 4.4s ease-in-out infinite}.reaction-motion{animation:greet 1.8s ease-in-out infinite}.crest{animation:crest 3.6s ease-in-out infinite}.tail{animation:tail 3.6s ease-in-out infinite}.claw-left{animation:claw-left 3.6s ease-in-out infinite}.claw-right{animation:claw-right 3.6s ease-in-out infinite}.happy-motion .claw-left{animation:wave-left 1.3s ease-in-out infinite}.happy-motion .claw-right{animation:wave-right 1.3s ease-in-out infinite}.happy-motion .limb-right{animation:wave-right 1.3s ease-in-out infinite}.working-motion .limb-left{animation:tap .65s ease-in-out infinite}.working-motion .limb-right{animation:tap .65s .32s ease-in-out infinite}.sparkles,.dream{animation:glow 1.8s ease-in-out infinite}.blink-open{animation:blink-open 4.1s linear infinite}.blink-lids{animation:blink-lids 4.1s linear infinite;opacity:0}.rest-motion .crest,.rest-motion .tail,.rest-motion .claw-left,.rest-motion .claw-right{animation-duration:5s}@keyframes breathe{50%{transform:translateY(-.16px)}}@keyframes focus{50%{transform:translateY(-.10px) rotate(.5deg)}}@keyframes rest{50%{transform:translateY(-.09px)}}@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-.65px) rotate(-1.2deg)}70%{transform:translateY(-.18px) rotate(1deg)}}@keyframes greet{50%{transform:translateY(-.3px) rotate(2deg)}}@keyframes crest{50%{transform:rotate(3deg)}}@keyframes tail{50%{transform:rotate(-5deg)}}@keyframes claw-left{50%{transform:rotate(-5deg)}}@keyframes claw-right{50%{transform:rotate(5deg)}}@keyframes wave-left{50%{transform:rotate(-20deg)}}@keyframes wave-right{50%{transform:rotate(20deg)}}@keyframes tap{50%{transform:translateY(.3px)}}@keyframes glow{50%{opacity:.35}}@keyframes blink-open{0%,93%,97%,100%{opacity:1}94%,96%{opacity:0}}@keyframes blink-lids{0%,93%,97%,100%{opacity:0}94%,96%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.blink-lids{display:none}}</style>
<ellipse id="shadow-js" cx="7.5" cy="16.5" rx="5.5" ry=".55" fill="#294b43" opacity=".09"/><ellipse cx="7.5" cy="16.5" rx="3.6" ry=".32" fill="#294b43" opacity=".07"/>
