<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" preserveAspectRatio="xMidYMid meet" role="img" data-species="penguin" data-art-version="3" aria-label="Midnight Penguin">
<title>Midnight Penguin — original artwork by FanxingMeng1999 (MIT)</title>
<defs>
<radialGradient id="paint-body" cx=".29" cy=".20" r=".84"><stop stop-color="#d3e3f9"/><stop offset=".42" stop-color="#aac9f3"/><stop offset="1" stop-color="#82a3d3"/></radialGradient>
