<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoWIN Quick Tasks</title>
  <style>
    :root {
      color-scheme: light;
      --panel-bg: rgba(255, 252, 247, 0.96);
      --panel-border: rgba(253, 186, 116, 0.32);
      --panel-shadow: 0 18px 44px rgba(249, 115, 22, 0.16);
      --summary-bg: rgba(255,255,255,0.72);
      --item-bg: rgba(255,255,255,0.84);
      --item-done-bg: rgba(245, 248, 251, 0.92);
      --input-bg: rgba(255,255,255,0.9);
      --text-main: #24324a;
      --text-muted: #7a889d;
      --line: rgba(148, 163, 184, 0.18);
      --chip: rgba(255, 237, 213, 0.9);
      --chip-text: #ea580c;
      --success: #10b981;
      --close-bg: rgba(255,255,255,0.84);
      --close-text: #fb7185;
      --scroll-thumb: rgba(251, 146, 60, 0.26);
      --auto-dot: #a855f7;
      --auto-dot-glow: rgba(168, 85, 247, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
    }
    body { padding: 0; }
    .panel {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      border: 1px solid var(--panel-border);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.96), rgba(255, 245, 235, 0.94) 60%, rgba(240, 253, 250, 0.92)),
        var(--panel-bg);
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .panel > * {
      position: relative;
      z-index: 1;
    }
    .panel.variant-grid::before {
      inset: 10px;
      opacity: 0.24;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .panel.variant-night::before {
      background:
        radial-gradient(circle at 18% 16%, rgba(255,255,255,0.12), transparent 22%),
        radial-gradient(circle at 82% 24%, rgba(255,255,255,0.1), transparent 20%),
        linear-gradient(135deg, rgba(255,255,255,0.06), transparent 56%);
      opacity: 0.9;
    }
    .panel.variant-night::after {
      background:
        radial-gradient(circle at 22% 22%, rgba(255,255,255,0.26) 0 1px, transparent 1.5px),
        radial-gradient(circle at 72% 18%, rgba(255,255,255,0.22) 0 1px, transparent 1.5px),
        radial-gradient(circle at 88% 70%, rgba(255,255,255,0.18) 0 1px, transparent 1.5px);
      opacity: 0.72;
    }
    .panel.variant-milk::before {
      background-image:
        radial-gradient(circle at 34px 30px, rgba(255,255,255,0.42) 0 2px, transparent 2.5px),
        radial-gradient(circle at 240px 48px, rgba(255,255,255,0.34) 0 2px, transparent 2.5px),
        radial-gradient(circle at 318px 88px, rgba(255,255,255,0.24) 0 2px, transparent 2.5px);
      opacity: 0.88;
    }
    .panel.variant-lab::before {
      background:
        repeating-linear-gradient(0deg, transparent 0, transparent 15px, rgba(255,255,255,0.07) 15px, rgba(255,255,255,0.07) 16px),
        repeating-linear-gradient(90deg, transparent 0, transparent 15px, rgba(255,255,255,0.05) 15px, rgba(255,255,255,0.05) 16px);
      opacity: 0.38;
    }
    .panel.variant-soda::before {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.14), transparent 44%),
        radial-gradient(circle at 84% 24%, rgba(255,255,255,0.18), transparent 22%),
        radial-gradient(circle at 14% 82%, rgba(255,255,255,0.12), transparent 18%);
      opacity: 0.95;
    }
    .panel.variant-paper::before {
      inset: 10px 12px;
      background:
        linear-gradient(180deg, transparent 0 14px, rgba(91, 77, 53, 0.08) 14px 15px, transparent 15px 29px),
        linear-gradient(90deg, rgba(255,255,255,0.12), transparent 30%);
      opacity: 0.66;
    }
    .panel.variant-paper::after {
      inset: 12px 16px auto auto;
      width: 84px;
      height: 20px;
      border-radius: 5px;
      transform: rotate(7deg);
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.42), rgba(255,255,255,0.12));
      opacity: 0.88;
    }
    .panel.variant-aurora::before {
      background:
        linear-gradient(120deg, transparent 12%, rgba(255,255,255,0.16) 36%, transparent 68%),
        radial-gradient(circle at 18% 20%, rgba(255,255,255,0.18), transparent 22%),
        radial-gradient(circle at 82% 76%, rgba(255,255,255,0.14), transparent 28%);
      opacity: 0.96;
    }
    .panel.variant-aurora::after {
      inset: 12px auto auto 14px;
      width: 168px;
      height: 56px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.46), transparent);
      filter: blur(16px);
      transform: rotate(-9deg);
      opacity: 0.28;
    }
    .panel.variant-cocoa::before {
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,0.12), transparent 20%),
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 42%),
        repeating-linear-gradient(90deg, transparent 0 19px, rgba(255,255,255,0.04) 19px 21px);
      opacity: 0.84;
    }
    .panel.variant-cocoa::after {
      inset: auto 18px 12px auto;
      width: 90px;
      height: 24px;
      background:
        radial-gradient(circle at 18% 62%, rgba(255,255,255,0.36) 0 4px, transparent 5px),
        radial-gradient(circle at 54% 42%, rgba(255,255,255,0.24) 0 6px, transparent 7px),
        radial-gradient(circle at 82% 60%, rgba(255,255,255,0.16) 0 3px, transparent 4px);
      opacity: 0.56;
    }
    .head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(253, 186, 116, 0.22);
    }
    .head-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }
    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .close-btn {
      border: 0;
      background: var(--close-bg);
      color: var(--close-text);
      width: 30px;
      height: 30px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      box-shadow: 0 4px 16px rgba(251, 113, 133, 0.18);
    }
    .clock-btn {
      border: 0;
      cursor: pointer;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(241, 245, 249, 0.92);
      color: #475569;
      border: 1px solid rgba(148, 163, 184, 0.28);
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    .clock-btn:hover { transform: translateY(-1px); }
    .clock-btn.is-active {
      background: linear-gradient(120deg, #10b981, #34d399);
      color: #ffffff;
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.22);
    }
    .clock-btn:disabled {
      opacity: 0.6;
      cursor: progress;
    }
    .clock-btn .clock-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #94a3b8;
      box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.18);
    }
    .clock-btn.is-active .clock-dot {
      background: #fef9c3;
      box-shadow: 0 0 0 2px rgba(254, 249, 195, 0.4);
    }
    .item-claim {
      flex: 0 0 auto;
      align-self: center;
      border: 0;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #fff7ed;
      background: linear-gradient(120deg, #fb923c, #f97316);
      box-shadow: 0 6px 16px rgba(249, 115, 22, 0.28);
      letter-spacing: 0.4px;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    .item-claim:hover { transform: translateY(-1px); }
    .item-claim:disabled {
      opacity: 0.6;
      cursor: progress;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .summary-card {
      border-radius: 14px;
      padding: 10px 10px 9px;
      background: var(--summary-bg);
      border: 1px solid rgba(253, 186, 116, 0.18);
    }
    .summary-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .summary-value {
      font-size: 18px;
      font-weight: 800;
    }
    .content {
      flex: 1;
      overflow: auto;
      padding: 12px 12px 14px;
    }
    .content::-webkit-scrollbar { width: 8px; }
    .content::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: var(--scroll-thumb);
    }
    .section + .section { margin-top: 12px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 800;
    }
    .section-note {
      font-size: 11px;
      color: var(--text-muted);
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 16px;
      background: var(--item-bg);
      border: 1px solid var(--line);
    }
    .item.is-done {
      opacity: 0.76;
      background: var(--item-done-bg);
    }
    .item.is-done .item-title,
    .item.is-done .item-desc {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      text-decoration-color: rgba(100, 116, 139, 0.7);
    }
    .item-checkbox {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      accent-color: #34d399;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .item-body {
      min-width: 0;
      flex: 1;
    }
    .item-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .item-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }
    .item-chip {
      flex: 0 0 auto;
      font-size: 10px;
      line-height: 1;
      padding: 4px 7px;
      border-radius: 999px;
      color: var(--chip-text);
      background: var(--chip);
      border: 1px solid rgba(251, 146, 60, 0.18);
    }
    .item-desc {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .item-meta {
      margin-top: 5px;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .item-progress {
      color: #fb923c;
      font-weight: 700;
    }
    .item-due {
      color: #64748b;
      font-weight: 600;
    }
    .item-due.is-overdue {
      color: #ef4444;
    }
    .item-auto {
      padding-left: 12px;
      position: relative;
    }
    .item-auto::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #a855f7;
      background: var(--auto-dot);
      box-shadow: 0 0 0 5px var(--auto-dot-glow);
    }
    .done-label {
      color: var(--success);
      font-weight: 700;
    }
    .empty {
      padding: 18px 14px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      border-radius: 18px;
      background: var(--summary-bg);
      border: 1px dashed rgba(253, 186, 116, 0.28);
    }
    .todo-quick-add {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px 72px;
      gap: 8px;
      margin-bottom: 8px;
    }
    .todo-input,
    .todo-select,
    .todo-deadline,
    .todo-add-btn {
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: var(--input-bg);
      color: var(--text-main);
      height: 34px;
      font-size: 12px;
      outline: none;
    }
    .todo-input {
      padding: 0 10px;
    }
    .todo-select {
      padding: 0 8px;
    }
    .todo-deadline {
      grid-column: 1 / -1;
      padding: 0 10px;
    }
    .todo-deadline:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      background: rgba(241, 245, 249, 0.88);
    }
    .todo-deadline.is-hidden {
      display: none;
    }
    .todo-add-btn {
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(120deg, var(--chip-text), var(--success));
      color: #fff7ed;
      border-color: rgba(249, 115, 22, 0.4);
    }
    .todo-add-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .todo-add-hint {
      min-height: 16px;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .todo-add-hint.error {
      color: #ef4444;
    }
    .todo-group + .todo-group {
      margin-top: 10px;
    }
    .todo-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .todo-group-title {
      font-weight: 700;
      color: #475569;
    }
    .todo-group-count {
      min-width: 20px;
      text-align: center;
      border-radius: 999px;
      padding: 2px 6px;
      background: rgba(253, 186, 116, 0.18);
      color: #c2410c;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <div class="head-top">
        <div>
          <div class="title">今日速勾</div>
          <div class="subtitle">悬停查看，Ctrl+Alt+Q 或托盘菜单可固定。这里会同步列出待完成日常和自定义待办。</div>
        </div>
        <div class="head-actions">
          <button id="clockBtn" class="clock-btn" type="button" title="一键切换上下班打卡">
            <span class="clock-dot"></span>
            <span id="clockBtnLabel">未上班</span>
          </button>
          <button id="closeBtn" class="close-btn" title="收起">×</button>
        </div>
      </div>
      <div id="summary" class="summary"></div>
    </div>
    <div class="content">
      <div class="section">
        <div class="section-head">
          <div class="section-title">自定义待办</div>
          <div class="section-note">临时待办完成后可点“收起”清理</div>
        </div>
        <div class="todo-quick-add">
          <input id="todoInput" class="todo-input" type="text" placeholder="快速添加待办…">
          <select id="todoCadence" class="todo-select">
            <option value="daily">每日</option>
            <option value="temporary" selected>临时</option>
            <option value="weekly">每周</option>
            <option value="longterm">长期</option>
          </select>
          <button id="todoAddBtn" class="todo-add-btn">添加</button>
          <input id="todoDeadline" class="todo-deadline" type="datetime-local" aria-label="临时任务DDL">
        </div>
        <div id="todoAddHint" class="todo-add-hint"></div>
        <div id="todoList" class="list"></div>
      </div>
      <div class="section">
        <div class="section-head">
          <div class="section-title">可手动勾选</div>
          <div class="section-note">勾一下就会同步到仪表盘</div>
        </div>
        <div id="manualList" class="list"></div>
      </div>
      <div class="section">
        <div class="section-head">
          <div class="section-title">自动联动任务</div>
          <div class="section-note">由打卡 / 在线时长 / 微复位 / 记录自动完成</div>
        </div>
        <div id="autoList" class="list"></div>
      </div>
      <div id="allDone" class="empty" hidden>今天的日常和待办基本清空了，可以安心继续主线。</div>
    </div>
  </div>
  <script src="quick-tasks-renderer.js"></script>
</body>
</html>
