<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #hit-area {
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #hit-area.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="hit-area"></div>
  <script src="hit-renderer.js"></script>
</body>
</html>
